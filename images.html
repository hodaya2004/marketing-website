<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Images Page</title>
        
        <!--Google font: Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="css/images.css">
    </head>
    <body>
        <div class="page-container">
            <header>
                <!-- Logo -->
                <div class="logo-area">
                    <a href="index.html">
                        <img src="img/ChatGPT-logo.png" alt="ChatGPT logo">
                        <span>ChatGPT</span>
                    </a>
                </div>

                <!-- Links -->
                <nav class="nav-links">
                    <a href="index.html">Main</a>
                    <a href="images.html">Images</a>
                    <a href="agent.html">Agent</a>
                </nav>

                <!-- Right actions -->
                <div class="auth-area">
                    <button type="button" class="btn-login">Log in</button>
                    <button type="button" class="btn-signup">Sign up for free</button>
                    <button type="button" class="btn-info"><img src="img/Request-info.png" alt="Request info"></button>
                </div>
            </header>

            <main>
                <h1 class="main-title">Images</h1>

                <!-- Style gallery section -->
                <section class="gallery-section">
                    <div class="section-top">
                        <h2>Try a style on an image</h2>
                        <div class="carousel-arrows">
                            <button type="button">
                                <img src="img/chevron_left.png" alt="chevron left">
                            </button>
                            <button type="button">
                                <img src="img/chevron_right.png" alt="chevron right">
                            </button>
                        </div>
                    </div>

                    <div class="style-cards">
                        <figure class="style-card">
                            <img src="img/images/sketch.jpg" alt="Sketch portrait style">
                            <figcaption>Sketch</figcaption>
                        </figure>
                        <figure class="style-card">
                            <img src="img/images/dramatic.jpg" alt="Dramatic black and white style">
                            <figcaption>Dramatic</figcaption>
                        </figure>
                        <figure class="style-card">
                            <img src="img/images/plushie.jpg" alt="Plushie toy style">
                            <figcaption>Plushie</figcaption>
                        </figure>
                        <figure class="style-card">
                            <img src="img/images/retro-anime.jpg" alt="Retro anime illustration style">
                            <figcaption>Retro anime</figcaption>
                        </figure>
                        <figure class="style-card">
                            <img src="img/images/baseball-bobblehead.jpg" alt="Baseball bobblehead style">
                            <figcaption>Baseball bobblehead</figcaption>
                        </figure>
                        <figure class="style-card">
                            <img src="img/images/doodle.jpg" alt="Doodle line drawing style">
                            <figcaption>Doodle</figcaption>
                        </figure>
                    </div>
                </section>

                <!-- Discover section -->
                <section class="discover-section">
                    <div class="section-top">
                        <h2>Discover something new</h2>
                        <div class="carousel-arrows">
                            <button type="button">
                                <img src="img/chevron_left.png" alt="chevron left">
                            </button>
                            <button type="button">
                                <img src="img/chevron_right.png" alt="chevron right">
                            </button>
                        </div>
                    </div>
                    
                    <div class="discover-cards">
                        <div class="discover-card">
                            <img src="img/images/pearl-girl.jpg" alt="Girl with a Pearl Earring style portrait">
                            <span>Me as The Girl with a Pearl</span>
                        </div>
                        <div class="discover-card">
                            <img src="img/images/product-photo.jpg" alt="Burger product photography">
                            <span>Create a professional product photo</span>
                        </div>
                        <div class="discover-card">
                            <img src="img/images/remove-bg.jpg" alt="Woman standing in a city street">
                            <span>Remove people in the background</span>
                        </div>
                        <div class="discover-card">
                            <img src="img/images/style-me.jpg" alt="Woman wearing professional business attire">
                            <span>Style me</span>
                        </div>
                        <div class="discover-card">
                            <img src="img/images/kpop-star.jpg" alt="Young K-Pop style singer portrait">
                            <span>What would I look like as a K-Pop star?</span>
                        </div>
                        <div class="discover-card">
                            <img src="img/images/keychain.jpg" alt="Dog figure keychain">
                            <span>Turn into a keychain</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
